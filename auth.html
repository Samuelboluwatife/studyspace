<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StudySpace | Sign In</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    /* ===== Reset ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Poppins", sans-serif;
    }

    body {
      display: flex;
      height: 100vh;
      background:url(./images/learning.webp);
      justify-content: center;
      align-items: center;
    }

    .auth-container {
      display: flex;
      width: 900px;
      height: 500px;
      background: #fff;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
      transition: transform 0.3s ease;
    }

    /* ===== Left Section ===== */
    .auth-info {
      flex: 1;
      background: linear-gradient(135deg, #4facfe, #0b63e6);
      color: #fff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 40px;
      text-align: center;
    }

    .auth-info h1 {
      font-size: 2rem;
      margin-bottom: 20px;
    }

    .auth-info p {
      font-size: 1rem;
      line-height: 1.6;
      max-width: 300px;
    }

    /* ===== Right Section ===== */
    .auth-form {
      flex: 1;
      padding: 50px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      transition: all 0.4s ease;
    }

    .auth-form h2 {
      margin-bottom: 25px;
      text-align: center;
      color: #4facfe;
    }

    .auth-form form {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    input {
      padding: 12px 15px;
      border: 1px solid #ccc;
      border-radius: 8px;
      outline: none;
      transition: 0.3s;
    }

    input:focus {
      border-color: #4facfe;
    }

    button {
     background: linear-gradient(135deg, #00c6fb, #005bea);
      border: none;
      color: white;
      font-size: 1rem;
      padding: 12px;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.3s;
    }

    button:hover {
      background: linear-gradient(135deg, #00c6fb, #005bea);
    }

    .toggle-text {
      text-align: center;
      margin-top: 15px;
      color: #333;
    }

    .toggle-text span {
      color: #4facfe;
      cursor: pointer;
      font-weight: 600;
    }

    @media (max-width: 768px) {
      body {
        background: #fff;
      }
      .auth-container {
        flex-direction: column;
        width: 95%;
      }
      .auth-info {
        display: none;
      }
      .auth-form {
        padding: 40px 25px;
      }
    }
  </style>
</head>
<body>
  <div class="auth-container">
    <!-- Left Info Section -->
    <div class="auth-info">
      <h1>Welcome to StudySpace</h1>
      <p>Your all-in-one digital companion for smarter studying, note-taking, and growth.</p>
    </div>

    <!-- Right Form Section -->
    <div class="auth-form" id="auth-form">
      <h2>Sign In</h2>
      <form id="loginForm">
        <input type="email" placeholder="Email" required />
        <input type="password" placeholder="Password" required />
        <button type="submit">Login</button>
      </form>

      <p class="toggle-text">Don’t have an account? <span id="toggleSignup">Sign up</span></p>
    </div>
  </div>

  <script>
    const authForm = document.getElementById("auth-form");
    const toggleSignup = document.getElementById("toggleSignup");

    toggleSignup.addEventListener("click", () => {
      if (authForm.querySelector("h2").textContent === "Sign In") {
        authForm.innerHTML = `
          <h2>Create Account</h2>
          <form id="signupForm">
            <input type="text" placeholder="Full Name" required />
            <input type="email" placeholder="Email" required />
            <input type="password" placeholder="Password" required />
            <button type="submit">Sign Up</button>
          </form>
          <p class="toggle-text">Already have an account? <span id="toggleLogin">Sign in</span></p>
        `;

         document.getElementById("toggleLogin").addEventListener("click", () => location.reload());
        document.getElementById("signupForm").addEventListener("submit", (e) => {
          e.preventDefault();
          
         setTimeout(() => {
      window.open("dashboard.html", "_blank")
      // dashboard page
            }, 2500);
        });
      }
    });

    // Redirect after login
    document.getElementById("loginForm").addEventListener("submit", (e) => {
      e.preventDefault();
          setTimeout(() => {
         // dashboard page
          window.open("dashboard.html", "_blank")
            }, 2500);
    });
  </script>
</body>
</html>
